<!DOCTYPE html>
<!-- Mixed inline direction: a Persian page whose sentences hold code, a version, a path, and an
     English quotation. The code, the version, and the path are left to right and isolated; the
     words around them keep the page's right-to-left order. -->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>متن آمیخته</title>
</head>
<body>
<main>
<h1>نصب بیکن</h1>
<p id="install">برای نصب <code id="inline-code">beacon init --force</code> را اجرا کنید؛ نسخهٔ <span id="version" dir="ltr">1.2.3</span> در تاریخ ۱۴۰۵/۰۸/۱۶ منتشر شد.</p>
<p id="configuration">فایل <code id="path-code">/etc/beacon/beacon.yml</code> را ویرایش کنید و مقدار <code id="flag-code">--dry-run</code> را بررسی کنید.</p>
<p id="quotation">راهنمای انگلیسی می‌گوید: <bdi id="quote" lang="en">Run beacon deploy before <span dir="ltr">18:00</span>.</bdi></p>
</main>
</body>
</html>
